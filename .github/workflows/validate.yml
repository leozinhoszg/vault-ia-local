name: validate-vault

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate editorial e técnico
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Dependências do validador
        run: python -m pip install --quiet openpyxl==3.1.5
      - name: Validador automatizado (links, Python, fórmulas e indicadores heurísticos; avisos não justificados falham)
        run: python 99-Templates/validate_vault_completo.py --strict
      - name: Índice de URLs está atualizado
        run: python 99-Templates/gerar_indice_urls.py --check
      - name: Lockfile existe e não mudou silenciosamente
        run: cd 07-Implementacao-Casa && sha256sum -c requirements-rag.lock.sha256
      - name: SCA do lockfile RAG (falha em vulnerabilidade conhecida)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: 07-Implementacao-Casa/requirements-rag.lock.txt
          require-hashes: true
          no-deps: true
      - name: Teste negativo de reconciliação requirements/lock
        run: |
          tmp_dir="$(mktemp -d)"
          cp -a . "$tmp_dir/vault"
          sed -i 's/^numpy==2\.4\.6$/numpy==2.4.5/' "$tmp_dir/vault/07-Implementacao-Casa/requirements-rag.txt"
          if (cd "$tmp_dir/vault" && python 99-Templates/validate_vault_completo.py --strict) > "$tmp_dir/output.txt" 2>&1; then
            echo "o validador aceitou uma divergência deliberada" >&2
            cat "$tmp_dir/output.txt"
            exit 1
          fi
          grep -q 'RAG_DIRECT_PIN_LOCK_MISMATCH' "$tmp_dir/vault/VALIDACAO-COMPLETA.md"
      - name: Planilha TCO reconciliada com modelo independente (exige valores em cache)
        run: python 99-Templates/check_tco.py
      - name: Selftest isolado dos guardrails do RAG (NumPy; sem Ollama, parser PDF ou downloads de modelo)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet numpy==2.4.6
          .venv/bin/python 07-Implementacao-Casa/RAG-local-executavel.py --help > RAG-CLI.txt
          grep -q -- '--max-files' RAG-CLI.txt
          grep -q -- '--max-entries' RAG-CLI.txt
          grep -q -- '--allow-remote-ollama' RAG-CLI.txt
          .venv/bin/python 07-Implementacao-Casa/RAG-local-executavel.py --selftest
      - name: Schema de resultados de benchmark
        run: python 99-Templates/validate_benchmarks.py
      - name: Compilação dos harnesses Python
        run: python -m py_compile 99-Templates/run_benchmark.py 99-Templates/validate_benchmarks.py
      - name: Relatórios como artefato
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorios-validacao
          path: |
            VALIDACAO-COMPLETA.md
            VALIDACAO.md

  release:
    name: Release versionada
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Empacotar vault com checksum
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="vault-ia-local-${VERSION}/" -o "vault-ia-local-${VERSION}.zip" HEAD
          sha256sum "vault-ia-local-${VERSION}.zip" > "vault-ia-local-${VERSION}.zip.sha256"
          awk '/^## Changelog/{f=1} f' MEMORY.md > RELEASE_NOTES.md
      - name: Publicar release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            vault-ia-local-*.zip
            vault-ia-local-*.zip.sha256
